<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahbuba’s Sparkle</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9FA;--ink:#2B1A33;--mut:#7A6A80;--card:#fff;--line:#EBD9E1;--rose:#F6E3EA;--gold:#B98A2E;--acc:#6D3B8C;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1020;--ink:#F6E9EE;--mut:#B9A5C0;--card:#271730;--line:#3C2848;--rose:#2F1C39;--gold:#E0B85A;--acc:#C79BE6;--on:#1B1020}}
:root[data-theme="dark"]{--bg:#1B1020;--ink:#F6E9EE;--mut:#B9A5C0;--card:#271730;--line:#3C2848;--rose:#2F1C39;--gold:#E0B85A;--acc:#C79BE6;--on:#1B1020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans','Hind Siliguri',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h3,.brand{font-family:'Bodoni Moda',Georgia,serif;font-weight:500}
.ann{background:var(--acc);color:var(--on);text-align:center;padding:8px 12px;font-size:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-size:24px;flex:1;min-width:160px}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
header input{flex:2;min-width:140px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:500;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px;font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding:40px 20px;background:var(--rose)}
.hero>div{flex:1 1 320px;max-width:560px}
h1{font-size:clamp(34px,6vw,60px);line-height:1.05;margin:0 0 14px}
.gem{flex:1 1 220px;max-width:340px;margin:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:16px 20px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 15px;font:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;padding:0 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.art{background:linear-gradient(160deg,var(--rose),var(--card));border-radius:10px}
.art svg{display:block;width:100%}
.card h3{font-size:17px;margin:4px 0 0}
.row,.dh,.ah,.ln{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ln{flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.mut{color:var(--mut);font-size:14px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.drawer[hidden],.adm[hidden]{display:none}
.tot{font-size:18px}
#co{display:flex;flex-direction:column;gap:8px}
.adm{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:12px 0}
.stats div{background:var(--rose);border-radius:12px;padding:14px;display:flex;flex-direction:column}
.stats b{font-size:26px;font-family:'Bodoni Moda',Georgia,serif;font-weight:500}
.form{display:flex;flex-direction:column;gap:12px;max-width:520px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);margin-left:6px;cursor:pointer}
.oc{border-bottom:1px solid var(--line);padding:8px 0}
.ln label input{width:90px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.2;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.tw{animation:none}#toast{transition:none}}
footer{padding:24px 20px;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
</style><script src="/_aistudio-iframe.js?v=1f94f900"></script></head><body>
<div class="ann" id="ann"></div>
<header><b class="brand" id="brand"></b><input id="q" placeholder="Search jewellery…" oninput="draw()" aria-label="Search"><button class="btn" id="cb" onclick="tgl('cart')">Cart (0)</button></header>
<main>
<section class="hero"><div><h1 id="h"></h1><p id="sub"></p><button class="btn" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Shop the collection</button></div>
<svg class="gem" viewBox="0 0 200 180" role="img" aria-label="Faceted gemstone"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--gold)"/></linearGradient></defs><polygon points="50,20 150,20 190,70 100,165 10,70" fill="url(#g1)"/><path d="M10 70h180M50 20l20 50 30 95 30-95 20-50M70 70h60" fill="none" stroke="var(--bg)" stroke-opacity=".7" stroke-width="2"/><g fill="var(--gold)"><path class="tw" d="M175 18l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path class="tw" style="animation-delay:.8s" d="M22 120l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g></svg></section>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
</main>
<footer id="ft"></footer>

<aside id="cart" class="drawer" hidden>
<div class="dh"><b>Your cart</b><button class="ghost" onclick="tgl('cart')">Close</button></div>
<div id="lines"></div><div id="sum"></div>
<div id="co"><input id="cn" placeholder="Full name"><input id="cp" placeholder="Phone (01XXXXXXXXX)" inputmode="numeric"><textarea id="ca" rows="2" placeholder="Full address"></textarea>
<select id="area" onchange="drawCart()"><option value="80">Inside Dhaka (৳80)</option><option value="130">Outside Dhaka (৳130)</option></select>
<select id="pay"><option>Cash on Delivery</option><option>bKash</option><option>Nagad</option><option>Card</option></select>
<div class="row"><input id="cc" placeholder="Coupon code" style="flex:1"><button class="ghost" onclick="coup()">Apply coupon</button></div>
<button class="btn" onclick="order()">Place order</button></div>
</aside>
<section id="admin" class="adm" hidden></section>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tk=n=>'৳'+Number(n).toLocaleString('en-US');
const D0={set:{name:'Mahbuba’s Sparkle',ann:'Free delivery over ৳2,500 · Use code SPARKLE10 for 10% off',h:'Jewellery that catches the light, and your eye.',sub:'Fashion jewellery for weddings, gifting and every ordinary Tuesday.',acc:''},
p:[{id:1,n:'Moonlit Pearl Necklace',c:'Necklaces',p:1850,s:12,m:'#C9A24B',g:'#F3E9F7'},{id:2,n:'Rosé Drop Earrings',c:'Earrings',p:950,s:20,m:'#D9A0A0',g:'#E8567A'},{id:3,n:'Starlight Solitaire Ring',c:'Rings',p:1250,s:3,m:'#C9A24B',g:'#8EC5F0'},{id:4,n:'Silver Vine Bracelet',c:'Bracelets',p:1450,s:9,m:'#B8BCC8',g:'#9B7BD4'},{id:5,n:'Bridal Kundan Set',c:'Necklaces',p:4800,s:5,m:'#C9A24B',g:'#E8567A'},{id:6,n:'Tiny Gold Hoops',c:'Earrings',p:550,s:30,m:'#C9A24B',g:'#C9A24B'},{id:7,n:'Amethyst Halo Ring',c:'Rings',p:1650,s:0,m:'#B8BCC8',g:'#8E4FC9'},{id:8,n:'Gold Charm Bracelet',c:'Bracelets',p:1950,s:14,m:'#C9A24B',g:'#F08A5D'}],o:[]};
let S;try{S=JSON.parse(localStorage.getItem('ms'))}catch(e){}S=S&&S.p?S:structuredClone(D0);
const save=()=>{try{localStorage.setItem('ms',JSON.stringify(S))}catch(e){}};
const cats=['Necklaces','Earrings','Rings','Bracelets'];let cat='All',cart={},tab='dash',coupon=false,tt;
function art(p){const m=p.m,g=p.g,t=p.c;let b;
if(t=='Rings')b=`<circle cx="50" cy="54" r="20" fill="none" stroke="${m}" stroke-width="5"/><path d="M42 30l8-10 8 10-8 10z" fill="${g}" stroke="${m}" stroke-width="2"/>`;
else if(t=='Earrings')b=[34,66].map(x=>`<path d="M${x} 14v10" stroke="${m}" stroke-width="3"/><path d="M${x} 24c-9 10-9 24 0 30 9-6 9-20 0-30z" fill="${g}" stroke="${m}" stroke-width="3"/>`).join('');
else if(t=='Necklaces')b=`<path d="M14 14c4 44 68 44 72 0" fill="none" stroke="${m}" stroke-width="3"/><circle cx="50" cy="54" r="9" fill="${g}" stroke="${m}" stroke-width="3"/>`;
else b=`<ellipse cx="50" cy="40" rx="30" ry="22" fill="none" stroke="${m}" stroke-width="6"/>`+[-60,-30,0,30,60].map(a=>`<circle cx="${50+30*Math.sin(a*Math.PI/180)}" cy="${40+22*Math.cos(a*Math.PI/180)}" r="4" fill="${g}"/>`).join('');
return `<svg viewBox="0 0 100 80" role="img" aria-label="${esc(p.n)}">${b}</svg>`}
function skin(){$('#brand').textContent=S.set.name;$('#ann').textContent=S.set.ann;$('#h').textContent=S.set.h;$('#sub').textContent=S.set.sub;
if(S.set.acc)document.documentElement.style.setProperty('--acc',S.set.acc);else document.documentElement.style.removeProperty('--acc')}
function draw(){const q=$('#q').value.toLowerCase();
$('#chips').innerHTML=['All',...cats].map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';draw()">${c}</button>`).join('');
const L=S.p.filter(p=>(cat=='All'||p.c==cat)&&p.n.toLowerCase().includes(q));
$('#grid').innerHTML=L.map(p=>`<article class="card"><div class="art">${art(p)}</div><h3>${esc(p.n)}</h3><div class="row"><b>${tk(p.p)}</b><span class="mut">${p.s>0?(p.s<=5?'Only '+p.s+' left':'In stock'):'Sold out'}</span></div><button class="btn" ${p.s<1?'disabled':''} onclick="add(${p.id})">Add to cart</button></article>`).join('')||'<p class="mut">No jewellery matches your search. Try another word or category.</p>';
drawCart()}
const lines=()=>Object.entries(cart).map(([id,q])=>({p:S.p.find(x=>x.id==id),q})).filter(l=>l.p);
function calc(){const sub=lines().reduce((a,l)=>a+l.p.p*l.q,0),disc=coupon?Math.round(sub*.1):0,del=sub==0||sub-disc>=2500?0:+$('#area').value;return{sub,disc,del,tot:sub-disc+del}}
function drawCart(){const L=lines(),c=calc();$('#cb').textContent='Cart ('+L.reduce((a,l)=>a+l.q,0)+')';
$('#lines').innerHTML=L.map(l=>`<div class="ln"><span>${esc(l.p.n)}</span><span><button class="ghost" onclick="chg(${l.p.id},-1)" aria-label="Remove one">−</button> ${l.q} <button class="ghost" onclick="chg(${l.p.id},1)" aria-label="Add one">+</button></span><b>${tk(l.p.p*l.q)}</b></div>`).join('')||'<p class="mut">Your cart is empty. Add a piece you love.</p>';
$('#sum').innerHTML=L.length?`<div class="ln"><span>Subtotal</span><b>${tk(c.sub)}</b></div>`+(c.disc?`<div class="ln"><span>Coupon</span><b>−${tk(c.disc)}</b></div>`:'')+`<div class="ln"><span>Delivery</span><b>${c.del?tk(c.del):'Free'}</b></div><div class="ln tot"><span>Total</span><b>${tk(c.tot)}</b></div>`:''}
function chg(id,d){const p=S.p.find(x=>x.id==id),n=(cart[id]||0)+d;if(n<=0)delete cart[id];else cart[id]=Math.min(n,p.s);drawCart()}
function add(id){chg(id,1);toast('Added to your cart')}
function coup(){coupon=$('#cc').value.trim().toUpperCase()=='SPARKLE10';toast(coupon?'Coupon applied: 10% off':'Coupon code not found');drawCart()}
function order(){const L=lines(),c=calc(),n=$('#cn').value.trim(),ph=$('#cp').value.trim(),ad=$('#ca').value.trim();
if(!L.length)return toast('Add something to your cart first');
if(!n||!ad)return toast('Enter your name and address');
if(!/^01\d{9}$/.test(ph))return toast('Enter an 11-digit phone number starting with 01');
const id=1001+S.o.length;S.o.unshift({id,n,ph,ad,pay:$('#pay').value,items:L.map(l=>l.q+'× '+l.p.n),tot:c.tot,st:'Pending',d:new Date().toLocaleDateString('en-GB')});
L.forEach(l=>l.p.s-=l.q);cart={};coupon=false;save();tgl('cart');draw();toast('Order #'+id+' placed. Thank you!')}
function tgl(id){const e=$('#'+id);e.hidden=!e.hidden;if(id=='admin'&&!e.hidden)adm()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
const ss=(k,v)=>{S.set[k]=v;persist();skin()};
const up=(id,k,v)=>{S.p.find(x=>x.id==id)[k]=Math.max(0,+v||0);save();draw()};
const del=id=>{S.p=S.p.filter(x=>x.id!=id);delete cart[id];save();draw();adm()};
const st=(id,v)=>{S.o.find(x=>x.id==id).st=v;persist()};
function addp(){const n=$('#an').value.trim(),p=+$('#ap').value,s=+$('#as').value;if(!n||!p)return toast('Enter a product name and price');
S.p.push({id:Date.now(),n,c:$('#ac').value,p,s:s||0,m:'#C9A24B',g:'#E8567A'});save();draw();adm();toast('Product added to the shop')}
function reset(){S=structuredClone(D0);save();skin();draw();adm();toast('Default data restored')}
function adm(){let b='';
const nav=[['dash','Dashboard'],['prod','Products'],['ord','Orders'],['set','Site settings']].map(([k,l])=>`<button class="chip ${k==tab?'on':''}" onclick="tab='${k}';adm()">${l}</button>`).join('');
if(tab=='dash'){const rev=S.o.filter(o=>o.st!='Cancelled').reduce((a,o)=>a+o.tot,0),low=S.p.filter(p=>p.s<=5);
b=`<div class="stats"><div><span>Revenue</span><b>${tk(rev)}</b></div><div><span>Orders</span><b>${S.o.length}</b></div><div><span>Pending</span><b>${S.o.filter(o=>o.st=='Pending').length}</b></div><div><span>Products</span><b>${S.p.length}</b></div></div><h3>Low stock</h3>`+(low.map(p=>`<div class="ln"><span>${esc(p.n)}</span><b>${p.s?p.s+' left':'Sold out'}</b></div>`).join('')||'<p class="mut">All products are well stocked.</p>')}
if(tab=='prod')b=S.p.map(p=>`<div class="ln"><span>${esc(p.n)}</span><label>Price <input type="number" value="${p.p}" onchange="up(${p.id},'p',this.value)"></label><label>Stock <input type="number" value="${p.s}" onchange="up(${p.id},'s',this.value)"></label><button class="ghost" onclick="del(${p.id})">Delete</button></div>`).join('')+`<h3>Add product</h3><div class="ln"><input id="an" placeholder="Product name"><select id="ac">${cats.map(c=>`<option>${c}</option>`).join('')}</select><input id="ap" type="number" placeholder="Price"><input id="as" type="number" placeholder="Stock"><button class="btn" onclick="addp()">Add product</button></div>`;
if(tab=='ord')b=S.o.map(o=>`<div class="oc"><div class="ln"><b>#${o.id} · ${esc(o.n)}</b><select onchange="st(${o.id},this.value)" aria-label="Order status">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s==o.st?'selected':''}>${s}</option>`).join('')}</select></div><p class="mut">${esc(o.items.join(', '))}<br>${esc(o.ph)} · ${esc(o.ad)}<br>${esc(o.pay)} · ${tk(o.tot)} · ${o.d}</p></div>`).join('')||'<p class="mut">No orders yet. Place a test order in the shop and it will appear here.</p>';
if(tab=='set')b=`<div class="form"><label>Shop name<input value="${esc(S.set.name)}" oninput="ss('name',this.value)"></label><label>Announcement bar<input value="${esc(S.set.ann)}" oninput="ss('ann',this.value)"></label><label>Homepage headline<input value="${esc(S.set.h)}" oninput="ss('h',this.value)"></label><label>Homepage text<input value="${esc(S.set.sub)}" oninput="ss('sub',this.value)"></label><div>Theme colour ${['#6D3B8C','#B0305C','#1F6F6B','#9A6B12'].map(c=>`<button class="sw" style="background:${c}" onclick="ss('acc','${c}')" aria-label="Colour ${c}"></button>`).join('')}</div><button class="ghost" onclick="reset()">Reset default data</button></div>`;
$('#admin').innerHTML=`<div class="ah"><b>Admin panel</b><button class="btn" onclick="tgl('admin')">Back to shop</button></div><div class="chips" style="padding-left:0">${nav}</div>${b}`}
skin();draw();
</script>
<style>
.art{position:relative;overflow:hidden}
.mq{overflow:hidden;white-space:nowrap;background:var(--rose);padding:6px 0;font-size:14px}.mq span{display:inline-block;padding-left:100%;animation:mq 24s linear infinite}@keyframes mq{to{transform:translateX(-100%)}}
.fl{background:var(--acc);color:var(--on);text-align:center;padding:7px 12px;font-weight:700;font-size:14px}.fl[hidden],.mq[hidden]{display:none}
.mod{position:fixed;inset:0;background:rgba(20,10,25,.6);z-index:35;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.mod[hidden]{display:none}
.mb{background:var(--bg);color:var(--ink);border-radius:16px;padding:18px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px}
.fb{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}.fb[hidden]{display:none}.btn.wa{left:auto;right:16px;background:#25D366;color:#073;text-decoration:none}
.pf{position:fixed;left:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;max-width:70vw}.pf.on{opacity:1;transform:none}
.hb{position:absolute;top:6px;right:6px;border:0;background:var(--card);color:var(--acc);border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}
.vb{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:2px 8px;border-radius:99px}
.zm>*{transition:transform .15s}
.wh{width:230px;height:230px;border-radius:50%;position:relative;border:4px solid var(--ink)}.wh span{position:absolute;left:50%;top:50%;margin:-10px 0 0 -16px;width:32px;text-align:center;color:#fff;font-weight:700;font-size:14px;text-shadow:0 0 3px #000}
.cs{display:flex;flex-wrap:wrap;gap:20px;align-items:center;padding:24px 20px}.cs>div{flex:1 1 280px}.cs img{flex:1 1 240px;max-width:100%;max-height:300px;object-fit:cover;border-radius:14px}.cs h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;margin:0 0 8px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.tc{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.tc.on{border-color:var(--acc)}.dots{display:flex}.dots i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);margin-right:-6px}
.fi{display:flex;flex-direction:column;font-size:13px}.ln .fi input{width:auto}.th{width:56px}.th svg,.th img{display:block;width:100%;border-radius:6px}
.a-shimmer .card{position:relative;overflow:hidden}.a-shimmer .card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-100%);animation:sh 4s infinite;pointer-events:none}@keyframes sh{60%,100%{transform:translateX(100%)}}
.a-aurora .hero{background:linear-gradient(120deg,var(--rose),color-mix(in srgb,var(--acc) 30%,var(--rose)),color-mix(in srgb,var(--gold) 35%,var(--rose)),var(--rose));background-size:300% 300%;animation:au 12s ease infinite}@keyframes au{50%{background-position:100% 50%}}
.a-glow .btn{animation:gl 2.4s ease-in-out infinite}@keyframes gl{50%{box-shadow:0 0 18px var(--acc)}}
.a-float .card{animation:fo 4s ease-in-out infinite}.a-float .card:nth-child(even){animation-delay:1.2s}@keyframes fo{50%{transform:translateY(-6px)}}
.fx{position:fixed;top:-20px;pointer-events:none;z-index:6;color:var(--gold);animation:fa linear infinite}@keyframes fa{to{transform:translateY(110vh) rotate(360deg)}}
